<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Line Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --panel:#161d26; --panel2:#1e2732; --edge:#2b3947; --edge2:#3a4b5c;
    --text:#eef3f8; --muted:#7d8b98; --dim:#54626f;
    --amber:#ffb300; --amber-d:#c98a00;
    --green:#29c467; --red:#ef4444; --blue:#3aa0ff;
    --disp:'Barlow Condensed', sans-serif;
    --body:'Barlow', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--body);height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  button{font-family:var(--body);cursor:pointer;border:none}
  input,select,textarea{font-family:var(--body)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .cond{font-family:var(--disp)}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;
    background:linear-gradient(180deg,#141b24,#0f151c);border-bottom:2px solid var(--edge);
    position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
  .brand .tag{font-family:var(--disp);font-weight:600;color:var(--amber);font-size:15px;letter-spacing:.14em;
    border:1px solid var(--amber-d);padding:2px 8px;border-radius:3px}
  .spacer{flex:1}
  .datenav{display:flex;align-items:center;gap:6px}
  .datenav .date{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.03em;min-width:230px;text-align:center;
    text-transform:uppercase;color:var(--text)}
  .clock{font-family:var(--mono);font-weight:600;font-size:19px;color:var(--amber);min-width:96px;text-align:right}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;
    padding:7px 12px;font-weight:600;font-size:13px;letter-spacing:.02em;transition:.12s;white-space:nowrap}
  .btn:hover{background:#26313d;border-color:#4a5d70}
  .btn.icon{padding:7px 10px;font-family:var(--mono)}
  .seg{display:flex;background:var(--panel);border:1px solid var(--edge2);border-radius:6px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);padding:8px 16px;font-family:var(--disp);font-weight:600;
    font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .seg button.on{background:var(--amber);color:#161009}
  input[type=date]{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;
    padding:6px 8px;font-family:var(--mono);font-size:13px}

  /* ---------- Board (TV) view ---------- */
  main{flex:1;padding:16px 18px 8px}
  .board-grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px}
  @media(min-width:1500px){.layout{display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}}
  .line-card{background:var(--panel);border:1px solid var(--edge);border-top:4px solid var(--edge2);
    border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
  .line-card .lc-head{display:flex;align-items:flex-start;gap:14px}
  .lc-no{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.1em;color:#0d1117;
    background:var(--text);border-radius:4px;padding:2px 9px;text-transform:uppercase}
  .lc-size{font-family:var(--disp);font-weight:700;font-size:40px;line-height:.9;letter-spacing:.01em}
  .lc-desc{font-family:var(--disp);font-weight:600;font-size:19px;color:var(--text);text-transform:uppercase;letter-spacing:.02em}
  .lc-of{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .lc-headtxt{flex:1;min-width:0}
  .lc-eff{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1;text-align:right}
  .lc-eff small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;font-weight:600;margin-top:3px}

  .gauge{margin-top:2px}
  .gauge .nums{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
  .gauge .count{font-family:var(--mono);font-weight:700;font-size:30px}
  .gauge .quota{font-family:var(--mono);font-weight:600;font-size:16px;color:var(--muted)}
  .bar{height:12px;background:#0c1116;border:1px solid var(--edge);border-radius:6px;margin-top:6px;overflow:hidden;position:relative}
  .bar .fill{height:100%;border-radius:5px 0 0 5px;transition:width .4s}
  .bar .tick{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.28)}

  .ops{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin-top:2px}
  .op{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;border-bottom:1px dotted #26313d;padding:2px 0}
  .op .role{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;align-self:center}
  .op .who{font-weight:600;font-family:var(--disp);font-size:16px;letter-spacing:.01em}
  .op .who.empty{color:var(--dim);font-weight:500}

  .lc-foot{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:auto;padding-top:6px;border-top:1px solid var(--edge)}
  .lc-foot b{color:var(--text);font-family:var(--mono);font-weight:600}

  /* status coloring */
  .st-run{border-top-color:var(--green)}
  .st-behind{border-top-color:var(--amber)}
  .st-low{border-top-color:var(--red)}
  .st-idle{border-top-color:var(--edge2)}

  /* side rail */
  .rail{display:flex;flex-direction:column;gap:12px}
  .rail .panel{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px}
  .rail h3{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--amber);margin-bottom:8px;border-bottom:1px solid var(--edge);padding-bottom:6px}
  .rail ul{list-style:none;display:flex;flex-direction:column;gap:3px}
  .rail li{font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
  .rail li .k{color:var(--muted);font-weight:600}
  .rail .none{color:var(--dim);font-size:13px;font-weight:500}
  .util-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:15px;font-weight:600;padding:2px 0}
  .util-row .lbl{font-family:var(--body);color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;align-self:center}

  .safety{margin:14px 0 4px;text-align:center;font-family:var(--disp);font-weight:700;font-size:22px;
    letter-spacing:.16em;color:#161009;background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 22px,#e2a000 22px,#e2a000 44px);
    padding:8px;border-radius:5px;text-transform:uppercase}

  /* ---------- Edit view ---------- */
  .edit-wrap{display:flex;flex-direction:column;gap:16px}
  .edit-lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
  .ecard{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:14px}
  .ecard .eh{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
  .ecard .eh .lc-no{font-size:14px}
  .ecard .eh input.lineno{width:52px}
  .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .fld input,.fld select,.fld textarea{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);
    border-radius:5px;padding:7px 9px;font-size:14px;width:100%}
  .fld input.mono,.fld input[inputmode]{font-family:var(--mono)}
  .fld textarea{resize:vertical;min-height:52px;line-height:1.35}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .ops-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .subhead{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:6px 0 4px}
  .eff-preview{font-family:var(--mono);font-weight:700;font-size:15px}
  .edit-staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .rm{background:transparent;color:var(--dim);border:1px solid var(--edge2);border-radius:4px;padding:4px 8px;font-size:12px}
  .rm:hover{color:var(--red);border-color:var(--red)}
  .addline{background:var(--panel2);border:1px dashed var(--edge2);color:var(--muted);border-radius:8px;
    padding:16px;font-family:var(--disp);font-weight:600;letter-spacing:.06em;font-size:15px;text-transform:uppercase}
  .addline:hover{color:var(--amber);border-color:var(--amber-d)}
  .savechip{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .savechip .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .savechip.saving .dot{background:var(--amber)}

  /* fullscreen tweaks */
  body.fs .topbar .hide-fs{display:none}
  .foot-note{text-align:center;color:var(--dim);font-size:11px;padding:6px 0 12px;font-family:var(--mono)}
  @media(max-width:900px){.board-grid{grid-template-columns:1fr}.layout{display:block}.rail{margin-top:14px}}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <h1>Daily Line Production</h1>
      <span class="tag" id="autoTag">AUTO 0%</span>
    </div>
    <div class="spacer"></div>
    <div class="datenav">
      <button class="btn icon" id="prevDay" title="Previous day">‹</button>
      <span class="date" id="dateLabel">—</span>
      <button class="btn icon" id="nextDay" title="Next day">›</button>
      <input type="date" id="datePick" class="hide-fs">
      <button class="btn hide-fs" id="todayBtn">Today</button>
    </div>
    <div class="clock mono" id="clock">--:--</div>
    <div class="seg hide-fs">
      <button id="mBoard" class="on">Board</button>
      <button id="mEdit">Edit</button>
    </div>
    <button class="btn" id="fsBtn" title="Fullscreen for TV">⛶ TV</button>
  </div>

  <main id="view"></main>
  <div class="foot-note" id="footNote"></div>

<script>
/* ============================ Reference data ============================ */
/* Which can sizes each line can run (drives the dropdowns) */
const LINE_SIZES = {
  "2": ["211x400","211x413","211x414","211x604","211x310"],
  "3": ["502x302","502x512","502x608","610x711"],
  "4": ["401x209","401x300","401x311","401x400","401x411","401x508","401x509","401x512","401x700"],
  "5": ["307x406","307x409","404x302","404x414","404x700"],
  "6": ["603x600","603x606","603x700","603x408","603x410","603x812","603x409"]
};
/* Quota targets: size -> { h: per hour, s: per shift }. Blank if plant hasn't set one. */
const QUOTA = {
  "211x400":{h:10000,s:80000}, "211x414":{h:10000,s:80000}, "211x604":{h:8750,s:70000},
  "502x302":{h:2500,s:20000}, "502x512":{h:2500,s:20000}, "502x608":{h:3125,s:25000}, "610x711":{h:1875,s:15000},
  "401x209":{h:10000,s:80000}, "401x300":{h:10000,s:80000}, "401x411":{h:10000,s:80000},
  "401x508":{h:10000,s:80000}, "401x512":{h:10000,s:80000}, "401x700":{h:10000,s:80000},
  "307x406":{h:6875,s:55000}, "404x302":{h:6875,s:55000}, "404x700":{h:6250,s:50000},
  "307x409":{h:8125,s:65000},
  "603x600":{h:10000,s:80000}, "603x606":{h:10000,s:80000}, "603x700":{h:10000,s:80000},
  "603x408":{h:6875,s:55000}, "603x410":{h:6250,s:50000}, "603x812":{h:6250,s:50000}
};
const ALL_SIZES = [...new Set(Object.values(LINE_SIZES).flat())];
const OP_ROLES = [
  ["run1st","Run 1st"], ["backup","Back Up"], ["bodymaker","Bodymaker"],
  ["doubleSeamer","Double Seamer"], ["palletizer","Palletizer"],
  ["frameStraps","Frame & Straps"], ["forklift","Forklift"]
];
const DEFAULT_LINE_ORDER = ["6","5","4","2"];
const STAFF_SECTIONS = [
  ["changeover","Change Over (CO)"], ["presses","Presses & Litho"],
  ["absent","Absent"], ["vacation","Vacation"], ["custodian","Custodian"]
];

/* ============================ Storage layer ============================ */
/* Uses the artifact shared store when available so a TV and an editing
   device see the same board; falls back to in-memory otherwise. */
const _mem = {};
const Store = {
  async get(key){
    try{ if(window.storage){ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; } }
    catch(e){ /* missing key throws */ }
    return _mem[key] ?? null;
  },
  async set(key,val){
    _mem[key]=val;
    try{ if(window.storage){ await window.storage.set(key, JSON.stringify(val), true); } }catch(e){}
  }
};

/* ============================ State ============================ */
let mode = "board";
let curDate = todayStr();
let board = null;
let saveTimer = null, saving = false;

function todayStr(d=new Date()){ return d.toLocaleDateString('en-CA'); } // YYYY-MM-DD local
function keyFor(date){ return "board:"+date; }
function fmtDateLong(date){
  const [y,m,d]=date.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function num(v){ const n=parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; }
function commas(n){ return n==null||n===''?'':Number(n).toLocaleString('en-US'); }

function blankLine(lineNo){
  return { lineNo:String(lineNo), size:"", desc:"", of:"", note:"",
    ops:{run1st:"",backup:"",bodymaker:"",doubleSeamer:"",palletizer:"",frameStraps:"",forklift:""},
    count:"", quota:"", spoilage:"", ends1:"", ends2:"", bonus:"",
    pallets:["","","",""] };
}
function blankBoard(date){
  return { date, lines: DEFAULT_LINE_ORDER.map(blankLine),
    staff:{changeover:"",presses:"",absent:"",vacation:"",custodian:""},
    hoursAvail:"", hoursWorked:"" };
}

async function loadBoard(date){
  const existing = await Store.get(keyFor(date));
  board = existing || blankBoard(date);
  board.date = date;
}
function scheduleSave(){
  saving=true; updateSaveChip();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ await Store.set(keyFor(board.date), board); saving=false; updateSaveChip(); }, 500);
}
function updateSaveChip(){
  const c=document.getElementById('saveChip'); if(!c) return;
  c.classList.toggle('saving',saving);
  c.querySelector('.txt').textContent = saving? 'Saving…' : 'Saved';
}

/* ============================ Calculations ============================ */
function lineEff(l){ const q=num(l.quota); return q>0? Math.round(num(l.count)/q*100):null; }
function lineStatus(l){
  if(!l.size) return "idle";
  const e=lineEff(l); if(e===null) return "run";
  if(e>=100) return "run"; if(e>=80) return "behind"; return "low";
}
function utilization(){
  const a=num(board.hoursAvail), w=num(board.hoursWorked);
  return a>0? Math.round(w/a*100):null;
}
function autoPct(){
  // Average progress toward shift quota across active lines.
  const active=board.lines.filter(l=>l.size && num(l.quota)>0);
  if(!active.length) return 0;
  const s=active.reduce((a,l)=>a+Math.min(num(l.count)/num(l.quota),1.5),0);
  return Math.round(s/active.length*100);
}

/* ============================ Render: shared ============================ */
function render(){
  document.getElementById('dateLabel').textContent = fmtDateLong(curDate);
  document.getElementById('datePick').value = curDate;
  document.getElementById('autoTag').textContent = "AUTO "+autoPct()+"%";
  document.getElementById('mBoard').classList.toggle('on',mode==="board");
  document.getElementById('mEdit').classList.toggle('on',mode==="edit");
  document.getElementById('footNote').textContent =
    mode==="edit" ? "Changes save automatically to this day. Baked-in quotas: pick a can size and the shift target fills in."
    : "Board view · updates live · press TV for fullscreen on a display";
  if(mode==="board") renderBoard(); else renderEdit();
}

/* ============================ Render: BOARD (TV) ============================ */
function renderBoard(){
  const statusColor={run:'var(--green)',behind:'var(--amber)',low:'var(--red)',idle:'var(--edge2)'};
  const cards = board.lines.map(l=>{
    const st=lineStatus(l), eff=lineEff(l);
    const q=num(l.quota), c=num(l.count);
    const pct=q>0?Math.min(c/q*100,100):0;
    const fillColor = st==='low'?'var(--red)':st==='behind'?'var(--amber)':'var(--green)';
    const ops = OP_ROLES.map(([k,label])=>{
      const who=(l.ops&&l.ops[k])?l.ops[k]:'';
      return `<div class="op"><span class="role">${label}</span><span class="who ${who?'':'empty'}">${esc(who)||'—'}</span></div>`;
    }).join('');
    const ends=[l.ends1,l.ends2].filter(Boolean).map(esc).join(' · ');
    const pallets=(l.pallets||[]).filter(Boolean);
    return `<div class="line-card st-${st}">
      <div class="lc-head">
        <span class="lc-no">Line ${esc(l.lineNo)}</span>
        <div class="lc-headtxt">
          <div class="lc-size">${esc(l.size)||'<span style="color:var(--dim)">— idle —</span>'}</div>
          ${l.desc?`<div class="lc-desc">${esc(l.desc)}</div>`:''}
          ${l.of?`<div class="lc-of">${esc(l.of)}</div>`:''}
        </div>
        <div class="lc-eff" style="color:${eff===null?'var(--muted)':statusColor[st]}">
          ${eff===null?'—':eff+'%'}<small>OF QUOTA</small>
        </div>
      </div>
      <div class="gauge">
        <div class="nums">
          <span class="count">${commas(c)||'0'}</span>
          <span class="quota">/ ${commas(q)||'—'} shift</span>
        </div>
        <div class="bar"><div class="fill" style="width:${pct}%;background:${fillColor}"></div>
          <div class="tick" style="left:100%"></div></div>
      </div>
      <div class="ops">${ops}</div>
      <div class="lc-foot">
        ${l.spoilage!==''?`<span>Spoilage <b>${esc(l.spoilage)}${/%/.test(l.spoilage)?'':'%'}</b></span>`:''}
        ${ends?`<span>Ends <b>${ends}</b></span>`:''}
        ${l.bonus?`<span>Bonus <b>${esc(l.bonus)}</b></span>`:''}
        ${pallets.length?`<span>Pallets <b>${pallets.map(esc).join(', ')}</b></span>`:''}
      </div>
    </div>`;
  }).join('');

  const railSections = STAFF_SECTIONS.map(([k,label])=>{
    const items=(board.staff[k]||'').split('\n').map(s=>s.trim()).filter(Boolean);
    return `<div class="panel"><h3>${label}</h3>
      ${items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:`<div class="none">— none —</div>`}
    </div>`;
  }).join('');
  const util=utilization();
  const railHours=`<div class="panel"><h3>Hours</h3>
    <div class="util-row"><span class="lbl">Available</span><span>${board.hoursAvail||'0'}</span></div>
    <div class="util-row"><span class="lbl">Worked</span><span>${board.hoursWorked||'0'}</span></div>
    <div class="util-row"><span class="lbl">Utilization</span><span style="color:var(--amber)">${util===null?'—':util+'%'}</span></div>
  </div>`;

  document.getElementById('view').innerHTML = `
    <div class="layout">
      <div class="board-grid">${cards}</div>
      <div class="rail">${railHours}${railSections}</div>
    </div>
    <div class="safety">Have a Safe &amp; Productive Day!</div>`;
}

/* ============================ Render: EDIT ============================ */
function renderEdit(){
  const lineCards = board.lines.map((l,idx)=>{
    const sizeOpts = sizeOptionsFor(l.lineNo, l.size);
    const eff=lineEff(l);
    const opFields = OP_ROLES.map(([k,label])=>`
      <div class="fld"><label>${label}</label>
        <input value="${esc(l.ops[k]||'')}" data-line="${idx}" data-op="${k}"></div>`).join('');
    const pallets = (l.pallets||["","","",""]).map((p,pi)=>`
      <div class="fld"><label>Pallet ${pi+1}</label>
        <input class="mono" value="${esc(p)}" data-line="${idx}" data-pallet="${pi}"></div>`).join('');
    return `<div class="ecard">
      <div class="eh">
        <span class="lc-no">Line</span>
        <input class="lineno mono" value="${esc(l.lineNo)}" data-line="${idx}" data-f="lineNo">
        <div class="spacer" style="flex:1"></div>
        <span class="eff-preview" style="color:${eff===null?'var(--muted)':(eff>=100?'var(--green)':eff>=80?'var(--amber)':'var(--red)')}">
          ${eff===null?'—':eff+'% of quota'}</span>
        <button class="rm" data-rmline="${idx}">Remove</button>
      </div>
      <div class="row2">
        <div class="fld"><label>Can size</label>
          <select data-line="${idx}" data-f="size">${sizeOpts}</select></div>
        <div class="fld"><label>Customer / OF</label>
          <input value="${esc(l.of)}" data-line="${idx}" data-f="of" placeholder="e.g. Juanitas"></div>
      </div>
      <div class="fld"><label>Description</label>
        <input value="${esc(l.desc)}" data-line="${idx}" data-f="desc" placeholder="e.g. 603x700 Juanita"></div>

      <div class="subhead">Operators</div>
      <div class="ops-edit">${opFields}</div>

      <div class="subhead">Production</div>
      <div class="row3">
        <div class="fld"><label>Count</label>
          <input class="mono" inputmode="numeric" value="${esc(l.count)}" data-line="${idx}" data-f="count"></div>
        <div class="fld"><label>Quota (shift)</label>
          <input class="mono" inputmode="numeric" value="${esc(l.quota)}" data-line="${idx}" data-f="quota"></div>
        <div class="fld"><label>Spoilage %</label>
          <input class="mono" value="${esc(l.spoilage)}" data-line="${idx}" data-f="spoilage"></div>
      </div>
      <div class="row3">
        <div class="fld"><label>Ends 1</label>
          <input value="${esc(l.ends1)}" data-line="${idx}" data-f="ends1"></div>
        <div class="fld"><label>Ends 2</label>
          <input value="${esc(l.ends2)}" data-line="${idx}" data-f="ends2"></div>
        <div class="fld"><label>Bonus</label>
          <input value="${esc(l.bonus)}" data-line="${idx}" data-f="bonus"></div>
      </div>
      <div class="subhead">Pallet # by job</div>
      <div class="row4">${pallets}</div>
    </div>`;
  }).join('');

  const staffFields = STAFF_SECTIONS.map(([k,label])=>`
    <div class="fld"><label>${label} — one name per line</label>
      <textarea data-staff="${k}" rows="4">${esc(board.staff[k]||'')}</textarea></div>`).join('');

  document.getElementById('view').innerHTML = `
    <div class="edit-wrap">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div class="savechip" id="saveChip"><span class="dot"></span><span class="txt">Saved</span></div>
        <div class="spacer" style="flex:1"></div>
        <button class="btn" id="copyPrev">Start from yesterday</button>
        <button class="btn" id="clearDay">Clear this day</button>
      </div>
      <div class="edit-lines">${lineCards}
        <button class="addline" id="addLine">+ Add line</button>
      </div>
      <div class="ecard">
        <div class="subhead">Staffing &amp; hours</div>
        <div class="edit-staff">${staffFields}</div>
        <div class="row2" style="margin-top:10px;max-width:420px">
          <div class="fld"><label>Hours available</label>
            <input class="mono" inputmode="decimal" value="${esc(board.hoursAvail)}" data-hours="hoursAvail"></div>
          <div class="fld"><label>Hours worked</label>
            <input class="mono" inputmode="decimal" value="${esc(board.hoursWorked)}" data-hours="hoursWorked"></div>
        </div>
      </div>
    </div>`;
  updateSaveChip();
}

function sizeOptionsFor(lineNo, current){
  const allowed = LINE_SIZES[String(lineNo)] || ALL_SIZES;
  let opts = `<option value="">— none —</option>`;
  allowed.forEach(s=>{ opts+=`<option value="${s}" ${s===current?'selected':''}>${s}</option>`; });
  // keep a current value that's outside the allowed list (e.g. line number edited)
  if(current && !allowed.includes(current)){
    opts+=`<option value="${current}" selected>${current}</option>`;
  }
  return opts;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================ Edit event wiring ============================ */
document.getElementById('view').addEventListener('input', e=>{
  const t=e.target; if(mode!=='edit') return;
  const li = t.getAttribute('data-line');
  if(li!==null){
    const idx=+li, l=board.lines[idx];
    if(t.dataset.op){ l.ops[t.dataset.op]=t.value; }
    else if(t.dataset.pallet!==undefined){ l.pallets[+t.dataset.pallet]=t.value; }
    else if(t.dataset.f){
      const f=t.dataset.f; l[f]=t.value;
      if(f==='size'){
        const qd=QUOTA[t.value];
        if(qd){ l.quota=String(qd.s); }
        if(!l.desc && t.value) l.desc=t.value;
        scheduleSave(); render(); return; // re-render to show filled quota + eff
      }
      if(f==='lineNo'){
        // refresh just this line's size options in place (keeps cursor in the field)
        const sel=document.querySelector(`.edit-lines select[data-line="${idx}"][data-f="size"]`);
        if(sel) sel.innerHTML=sizeOptionsFor(l.lineNo,l.size);
        scheduleSave(); return;
      }
      if(f==='count'||f==='quota'){ updateLiveEff(idx); }
    }
    scheduleSave();
    if(t.dataset.f==='count'||t.dataset.f==='quota') { /* live eff handled */ }
    document.getElementById('autoTag').textContent = "AUTO "+autoPct()+"%";
    return;
  }
  if(t.dataset.staff!==undefined){ board.staff[t.dataset.staff]=t.value; scheduleSave(); return; }
  if(t.dataset.hours){ board[t.dataset.hours]=t.value; scheduleSave(); return; }
});
function updateLiveEff(idx){
  // update the little efficiency preview without full re-render (keeps focus)
  const cards=document.querySelectorAll('.edit-lines .ecard');
  const l=board.lines[idx], eff=lineEff(l);
  const el=cards[idx] && cards[idx].querySelector('.eff-preview');
  if(el){ el.textContent = eff===null?'—':eff+'% of quota';
    el.style.color = eff===null?'var(--muted)':(eff>=100?'var(--green)':eff>=80?'var(--amber)':'var(--red)'); }
}
document.getElementById('view').addEventListener('click', async e=>{
  const t=e.target;
  if(t.id==='addLine'){ board.lines.push(blankLine("")); scheduleSave(); render(); }
  else if(t.dataset.rmline!==undefined){ board.lines.splice(+t.dataset.rmline,1); scheduleSave(); render(); }
  else if(t.id==='clearDay'){ if(confirm('Clear all entries for this day?')){ board=blankBoard(curDate); scheduleSave(); render(); } }
  else if(t.id==='copyPrev'){ await copyFromYesterday(); }
});
async function copyFromYesterday(){
  const [y,m,d]=curDate.split('-').map(Number);
  const prev=todayStr(new Date(y,m-1,d-1));
  const src=await Store.get(keyFor(prev));
  if(!src){ alert('No board found for '+fmtDateLong(prev)); return; }
  // copy setup (lines, operators, staffing) but zero the counts
  board = JSON.parse(JSON.stringify(src));
  board.date=curDate;
  board.lines.forEach(l=>{ l.count=''; l.spoilage=''; l.bonus=''; l.pallets=['','','','']; });
  board.hoursWorked='';
  scheduleSave(); render();
}

/* ============================ Nav / mode / fullscreen ============================ */
async function goDate(date){ curDate=date; await loadBoard(date); render(); }
document.getElementById('prevDay').onclick=()=>{ const[y,m,d]=curDate.split('-').map(Number); goDate(todayStr(new Date(y,m-1,d-1))); };
document.getElementById('nextDay').onclick=()=>{ const[y,m,d]=curDate.split('-').map(Number); goDate(todayStr(new Date(y,m-1,d+1))); };
document.getElementById('todayBtn').onclick=()=>goDate(todayStr());
document.getElementById('datePick').onchange=e=>goDate(e.target.value);
document.getElementById('mBoard').onclick=()=>{ mode='board'; render(); };
document.getElementById('mEdit').onclick=()=>{ mode='edit'; render(); };
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); mode='board'; render(); }
  else document.exitFullscreen&&document.exitFullscreen();
};
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fs',!!document.fullscreenElement));

/* live clock */
function tick(){ document.getElementById('clock').textContent =
  new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }
setInterval(tick,1000); tick();

/* poll storage while in board mode so a second screen picks up edits */
setInterval(async()=>{
  if(mode!=='board'||saving) return;
  const fresh=await Store.get(keyFor(curDate));
  if(fresh){ board=fresh; board.date=curDate; renderBoard();
    document.getElementById('autoTag').textContent="AUTO "+autoPct()+"%"; }
},12000);

/* ============================ Boot ============================ */
(async function init(){ await loadBoard(curDate); render(); })();
</script>
</body>
