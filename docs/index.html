<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Line Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --panel:#161d26; --panel2:#1e2732; --edge:#2b3947; --edge2:#3a4b5c;
    --text:#eef3f8; --muted:#8593a0; --dim:#54626f;
    --amber:#ffb300; --amber-d:#c98a00;
    --green:#29c467; --red:#ef4444; --blue:#3aa0ff; --purple:#a175ff;
    --disp:'Barlow Condensed', sans-serif;
    --body:'Barlow', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--body);height:100%}
  body{display:flex;flex-direction:column;min-height:100vh}
  button{font-family:var(--body);cursor:pointer;border:none}
  input,select,textarea{font-family:var(--body)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;gap:16px;padding:10px 18px;
    background:linear-gradient(180deg,#141b24,#0f151c);border-bottom:2px solid var(--edge);
    position:sticky;top:0;z-index:30;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo{height:38px;width:auto;background:#fff;border-radius:7px;padding:3px 5px}
  .brand h1{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase}
  .cochip{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 11px;border-radius:5px;white-space:nowrap}
  .cochip.has{color:#fff;background:var(--red)}
  .cochip.none{color:var(--muted);border:1px solid var(--edge2)}
  .livenote{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--green);white-space:nowrap}
  .livenote.stale{color:var(--amber)}
  .livenote:empty{display:none}
  .spacer{flex:1}
  .datenav{display:flex;align-items:center;gap:6px}
  .datenav .date{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:.03em;min-width:230px;text-align:center;
    text-transform:uppercase;color:var(--text)}
  .clock{font-family:var(--mono);font-weight:600;font-size:19px;color:var(--amber);min-width:96px;text-align:right}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;
    padding:7px 12px;font-weight:600;font-size:13px;letter-spacing:.02em;transition:.12s;white-space:nowrap}
  .btn:hover{background:#26313d;border-color:#4a5d70}
  .btn.icon{padding:7px 10px;font-family:var(--mono)}
  .seg{display:flex;background:var(--panel);border:1px solid var(--edge2);border-radius:6px;overflow:hidden}
  .seg button{background:transparent;color:var(--muted);padding:8px 16px;font-family:var(--disp);font-weight:600;
    font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .seg button.on{background:var(--amber);color:#161009}
  input[type=date]{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;
    padding:6px 8px;font-family:var(--mono);font-size:13px}

  /* ---------- Board (TV) view ---------- */
  main{flex:1;padding:16px 18px 8px}
  /* Board tiles flow into a grid whose column count adapts to how many are shown
     (set inline per render), ordered by status. Tiles stretch to fill their cell. */
  .board-grid{display:grid;gap:14px;align-content:start}
  .board-grid .line-card{min-width:0}
  .board-empty{color:var(--dim);font-family:var(--disp);font-weight:600;font-size:18px;
    letter-spacing:.04em;padding:40px;text-align:center}
  @media(min-width:1500px){.layout{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}}

  .line-card{background:var(--panel);border:1px solid var(--edge);border-top:5px solid var(--edge2);
    border-radius:9px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
  .line-card.idle{opacity:.66}

  .lc-head{display:flex;align-items:flex-start;gap:12px}
  .lc-no{font-family:var(--disp);font-weight:700;font-size:16px;letter-spacing:.08em;color:#0d1117;
    background:var(--text);border-radius:5px;padding:3px 11px;text-transform:uppercase;flex:none;margin-top:4px}
  .lc-headtxt{flex:1;min-width:0}
  .lc-po{flex:none;align-self:flex-start;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--text);
    background:var(--edge-soft,rgba(255,255,255,.05));border:1px solid var(--edge);border-radius:6px;padding:4px 10px;white-space:nowrap}
  .lc-po .lbl{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--muted);margin-right:5px}
  /* pallet set-up chips */
  .setup{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px solid var(--edge)}
  .setup-lbl{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:2px}
  .pal{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.02em;color:var(--blue);
    background:rgba(58,160,255,.1);border:1px solid rgba(58,160,255,.35);border-radius:5px;padding:3px 9px}
  .lc-row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .status-pill{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase;
    border-radius:7px;padding:6px 15px;line-height:1;white-space:nowrap;flex:none}
  .status-pill.co{box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:copulse 1.6s infinite}
  @keyframes copulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 13px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
  .lc-size{font-family:var(--disp);font-weight:700;font-size:46px;line-height:.88;letter-spacing:.01em}
  .lc-desc{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}

  /* jobs — one or more products running on the line (same size, different customer) */
  .jobs{display:flex;flex-direction:column}
  .job{padding:7px 0}
  .job + .job{border-top:1px dashed var(--edge)}
  .job-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .job-cust{font-family:var(--disp);font-weight:700;font-size:23px;text-transform:uppercase;letter-spacing:.02em;color:var(--text)}
  .job-code{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--amber);
    background:rgba(255,179,0,.08);border:1px solid var(--amber-d);border-radius:5px;padding:2px 8px}
  /* stripe badge (I/S / O/S) — its own color so it reads apart from the code */
  .job-stripe{display:inline-flex;gap:4px;align-self:center}
  .stripe-tag{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.04em;color:var(--purple);
    background:rgba(161,117,255,.14);border:1px solid var(--purple);border-radius:5px;padding:2px 8px}
  .job-meta{display:flex;gap:20px;flex-wrap:wrap;align-items:baseline;margin-top:3px;font-size:14px;color:var(--muted)}
  .job-meta b{color:var(--text);font-family:var(--mono);font-weight:600;font-size:15px}
  .job-meta .lbl{font-family:var(--disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .job-meta .done{color:var(--green);font-weight:700}
  /* remaining ("Left") is the big number; order/made yesterday are small print */
  .job-meta b{font-size:20px}
  .job-meta .ord-sub{font-size:12px;color:var(--dim);font-weight:500}

  /* crew — each position holds up to 3 people (primary + up to 2 more, e.g. a trainee) */
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:5px 20px;margin-top:2px;padding-top:8px;border-top:1px solid var(--edge)}
  .op{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dotted #26313d;padding:4px 0}
  .op .role{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.05em;flex:none}
  .op .who{display:flex;flex-direction:column;align-items:flex-end;gap:0;font-family:var(--disp);text-align:right}
  .op .who .n1{font-weight:600;font-size:20px;letter-spacing:.01em}
  .op .who .nx{font-weight:600;font-size:13.5px;color:var(--amber);letter-spacing:.02em}
  .op .who.empty{font-weight:500;font-size:16px;color:var(--dim)}

  /* side rail */
  .rail{display:flex;flex-direction:column;gap:12px}
  .rail .panel{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px}
  .rail h3{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--amber);margin-bottom:8px;border-bottom:1px solid var(--edge);padding-bottom:6px}
  .rail .panel.pab h3{color:var(--red)}
  .rail .panel.pvac h3{color:var(--blue)}
  .rail .panel.pcust h3{color:var(--muted)}
  .rail ul{list-style:none;display:flex;flex-direction:column;gap:4px}
  .rail li{font-size:17px;font-weight:600;font-family:var(--disp);letter-spacing:.01em}
  .rail .none{color:var(--dim);font-size:14px;font-weight:500}
  .rail .panel.ppress h3{color:var(--green)}
  .rail .press-list li{display:flex;flex-direction:column;gap:1px}
  .rail .press-top{display:flex;align-items:baseline;gap:8px}
  .rail .press-no{flex:0 0 auto;min-width:74px;font-size:13px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted)}
  .rail .press-op{flex:1 1 auto;font-size:17px;font-weight:600}
  .rail .press-detail{font-family:var(--disp);font-weight:600;font-size:13px;color:var(--amber);
    letter-spacing:.02em;padding-left:82px}

  /* status legend */
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 2px 2px}
  .legend .li{display:flex;align-items:center;gap:7px;font-family:var(--disp);font-weight:600;font-size:13px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .legend .sw{width:14px;height:14px;border-radius:4px;flex:none}

  .safety{margin:8px 0 4px;text-align:center;font-family:var(--disp);font-weight:700;font-size:22px;
    letter-spacing:.16em;color:#161009;background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 22px,#e2a000 22px,#e2a000 44px);
    padding:8px;border-radius:5px;text-transform:uppercase}

  /* ---------- Edit view ---------- */
  .edit-wrap{display:flex;flex-direction:column;gap:16px}
  .edit-lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .ecard{background:var(--panel);border:1px solid var(--edge);border-top-width:4px;border-radius:8px;padding:14px}
  .ecard .eh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;row-gap:6px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--edge)}
  .ecard .eh .lc-no{font-size:14px}
  .ecard .eh input.lineno{width:52px}
  .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
  .fld .hint{font-size:11px;color:var(--dim);font-weight:500;text-transform:none;letter-spacing:0}
  .fld input,.fld select,.fld textarea{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);
    border-radius:5px;padding:8px 9px;font-size:15px;width:100%}
  .fld select.status-sel{font-family:var(--disp);font-weight:700;letter-spacing:.04em}
  .fld input.mono,.fld input[inputmode]{font-family:var(--mono)}
  .fld textarea{resize:vertical;min-height:52px;line-height:1.35}
  .names{display:flex;flex-direction:column;gap:5px}
  .names select{background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;padding:8px 9px;font-size:15px;width:100%}
  .names select.trainee{border-style:dashed;color:var(--amber)}
  .addname{align-self:flex-start;background:transparent;border:1px dashed var(--edge2);color:var(--muted);
    border-radius:5px;padding:5px 10px;font-size:12px;font-weight:600;letter-spacing:.02em}
  .addname:hover{color:var(--amber);border-color:var(--amber-d)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
  .row2 .fld,.row3 .fld{margin-bottom:0}
  .ops-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pallet-pick{display:flex;flex-wrap:wrap;gap:8px}
  .palchip{font-family:var(--disp);font-weight:700;font-size:14px;letter-spacing:.02em;cursor:pointer;
    background:var(--panel2);color:var(--muted);border:1px solid var(--edge2);border-radius:7px;padding:8px 13px}
  .palchip:hover{border-color:var(--blue);color:var(--text)}
  .palchip.on{background:rgba(58,160,255,.16);border-color:var(--blue);color:var(--blue)}
  /* stripe chips share the pill shape but use purple so they read apart from pallet */
  .stripechip:hover{border-color:var(--purple);color:var(--text)}
  .stripechip.on{background:rgba(161,117,255,.16);border-color:var(--purple);color:var(--purple)}
  /* red highlight on a field that's part of a scheduling conflict */
  select.conflict{border:2px solid var(--red) !important;background:rgba(239,68,68,.16) !important;color:var(--text) !important}
  /* keep the open dropdown list readable (don't let the pink tint bleed onto the options) */
  select.conflict option{background:var(--panel) !important;color:var(--text) !important}
  /* amber caution: a soft heads-up (e.g. covering Run 1st then Run 2nd) — edit view only */
  select.caution{border:2px solid var(--amber) !important;background:rgba(255,179,0,.14) !important;color:var(--text) !important}
  select.caution option{background:var(--panel) !important;color:var(--text) !important}
  /* press department rows */
  .pressrows{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  /* fixed columns: press | operator(grows) | end | type | qty | remove */
  .pressrow{display:grid;grid-template-columns:128px minmax(120px,1fr) 76px 118px 60px 30px;
    gap:8px;align-items:start}
  .pressrow .names{margin:0;min-width:0}
  .pressrow .press-unit,.pressrow .press-end,.pressrow .press-mode,.pressrow .press-qty{
    background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;
    padding:8px 9px;font-size:15px;width:100%}
  .pressrow .press-unit{font-family:var(--disp);font-weight:700;letter-spacing:.03em}
  .pressrow .press-mode{font-family:var(--disp);font-weight:600}
  .pressrow .press-qty{font-family:var(--mono)}
  .pressrow .pressrm{padding:8px 6px}
  .subhead{font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);margin:8px 0 4px}
  .jobedit{border:1px solid var(--edge);border-radius:6px;padding:10px;margin-bottom:8px;background:#131a22}
  .jobedit-h{display:flex;align-items:center;justify-content:space-between;font-family:var(--disp);font-weight:700;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .jobedit-h button{background:transparent;color:var(--dim);border:none;font-size:12px;font-weight:600;cursor:pointer}
  .jobedit-h button:hover{color:var(--red)}
  .addjob{width:100%;background:transparent;border:1px dashed var(--edge2);color:var(--muted);border-radius:6px;
    padding:9px;font-family:var(--disp);font-weight:600;letter-spacing:.05em;font-size:13px;text-transform:uppercase}
  .addjob:hover{color:var(--amber);border-color:var(--amber-d)}
  .edit-staff{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .btn.tiny{padding:3px 9px;font-size:12px;margin-left:8px;vertical-align:middle}
  .staff-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media(max-width:820px){.staff-row{grid-template-columns:1fr}}
  .rm{background:transparent;color:var(--dim);border:1px solid var(--edge2);border-radius:4px;padding:5px 9px;font-size:12px}
  .rm:hover{color:var(--red);border-color:var(--red)}
  .hidebtn{background:transparent;color:var(--muted);border:1px solid var(--edge2);border-radius:4px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .hidebtn:hover{color:var(--text);border-color:var(--muted)}
  .hidebtn.on{color:var(--amber);border-color:var(--amber-d)}
  .hidden-tag{font-family:var(--disp);font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--amber);background:rgba(255,179,0,.08);border:1px solid var(--amber-d);border-radius:4px;padding:2px 7px}
  .ecard.is-hidden{opacity:.6}
  .addline{background:var(--panel2);border:1px dashed var(--edge2);color:var(--muted);border-radius:8px;
    padding:16px;font-family:var(--disp);font-weight:600;letter-spacing:.06em;font-size:15px;text-transform:uppercase}
  .addline:hover{color:var(--amber);border-color:var(--amber-d)}
  .savechip{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .savechip .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
  .savechip.saving .dot{background:var(--amber)}
  .savechip.error{color:var(--red)}
  .savechip.error .dot{background:var(--red)}

  /* scheduling-conflict warning (both views) */
  #conflictBox:empty{display:none}
  .conflicts{background:rgba(239,68,68,.1);border:1px solid var(--red);border-radius:8px;padding:12px 15px;margin-bottom:12px}
  .conflicts-h{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:.04em;color:var(--red);margin-bottom:6px}
  .conflicts ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .conflicts li{font-size:15px;color:var(--text);line-height:1.35}
  .conflicts li b{font-family:var(--disp);font-weight:700}
  /* amber caution banner — soft heads-up, shown on the edit view only */
  .cautions{background:rgba(255,179,0,.09);border:1px solid var(--amber-d);border-radius:8px;padding:10px 15px;margin-bottom:12px}
  .cautions-h{font-family:var(--disp);font-weight:800;font-size:14px;letter-spacing:.04em;color:var(--amber);margin-bottom:5px}
  .cautions ul{list-style:none;display:flex;flex-direction:column;gap:5px}
  .cautions li{font-size:14px;color:var(--text);line-height:1.35}
  .cautions li b{font-family:var(--disp);font-weight:700}

  /* announcement banner — bright, high-contrast, impossible to miss on the floor */
  .announce{display:flex;align-items:center;gap:16px;margin-bottom:12px;padding:14px 20px;border-radius:12px;
    background:linear-gradient(90deg,rgba(255,179,0,.22),rgba(255,179,0,.10));
    border:2px solid var(--amber);box-shadow:0 0 0 3px rgba(255,179,0,.18),0 6px 22px rgba(0,0,0,.35);
    animation:announcePulse 2.4s ease-in-out infinite}
  @keyframes announcePulse{0%,100%{box-shadow:0 0 0 3px rgba(255,179,0,.14),0 6px 22px rgba(0,0,0,.35)}
    50%{box-shadow:0 0 0 6px rgba(255,179,0,.30),0 6px 22px rgba(0,0,0,.35)}}
  /* the announcement editor box — roomy and legible, not a cramped default field */
  .announce-input{display:block;width:100%;box-sizing:border-box;resize:vertical;min-height:80px;
    margin:2px 0 12px;background:var(--panel2);color:var(--text);border:1px solid var(--amber-d);
    border-radius:9px;padding:13px 15px;font-family:var(--disp);font-weight:600;font-size:18px;line-height:1.4}
  .announce-input::placeholder{color:var(--dim);font-weight:500}
  .announce-input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,179,0,.20)}
  .announce-ico{font-size:34px;line-height:1;flex:none}
  .announce-body{min-width:0}
  .announce-h{display:block;font-family:var(--disp);font-weight:800;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--amber)}
  .announce-msg{font-family:var(--disp);font-weight:700;font-size:24px;line-height:1.25;color:var(--text);
    white-space:pre-wrap;word-break:break-word}
  @media (prefers-reduced-motion:reduce){ .announce{animation:none} }

  /* roster manager */
  .roster{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--edge2);
    border-radius:6px;padding:5px 5px 5px 12px;font-family:var(--disp);font-weight:600;font-size:16px}
  .chip button{background:transparent;border:none;color:var(--dim);font-size:18px;line-height:.9;padding:0 5px;cursor:pointer}
  .chip button:hover{color:var(--red)}
  .roster-add{display:flex;gap:8px;max-width:440px}
  .roster-add input{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--edge2);border-radius:5px;padding:9px 10px;font-size:15px}

  /* fullscreen tweaks */

<script>
/* ============================ Backend config ============================
   This page is static (GitHub Pages). Point API_URL at the Cloudflare Worker
   (see HOSTING.md) and every screen — the shop-floor TV and the office editor —
   shares one live board. Leave API_URL blank and the board still works, saved
   in this browser's localStorage (single device, no cross-screen sync). */
var API_URL = 'https://daily-schedule.jmarrujo.workers.dev';   // Cloudflare Worker (Google Sheet store)
var API_SECRET = '';    // set only if you set API_TOKEN on the Worker

/* Bump on every page change — shows bottom-right so you can confirm a reload
   actually picked up the latest page (a stale cached page shows an older tag). */
var APP_VERSION = 'v42';

/* Call a backend function: callApi('fn',[args]) -> Promise(result). */
async function callApi(fn, args){
  const r = await fetch(API_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fn:fn, args:args||[], secret:API_SECRET})
  });
  let j;
  try{ j = await r.json(); }catch(e){ throw new Error('Server returned a non-JSON response'); }
  if(!j || j.ok!==true) throw new Error((j && j.error) ? j.error : ('Request failed ('+r.status+')'));
  return j.result;
}

/* ============================ Reference data ============================ */
/* Which can sizes each line can run (drives the dropdowns) */
const LINE_SIZES = {
  "2": ["211x400","211x413","211x414","211x604","211x310"],
  "3": ["502x302","502x512","502x608","610x711"],
  "4": ["401x209","401x300","401x311","401x400","401x411","401x508","401x509","401x512","401x700"],
  "5": ["307x406","307x409","404x302","404x414","404x700"],
  "6": ["603x600","603x606","603x700","603x408","603x410","603x812","603x409"]
};
const ALL_SIZES = [...new Set(Object.values(LINE_SIZES).flat())];

/* Crew positions shown on each line. Each holds up to 3 people (MAX_PER_POS)
   — normally one operator, occasionally a 2nd/3rd when someone is training.
   (Back Up is a line STATUS now, not a position.) */
const OP_ROLES = [
  ["bodymaker","Bodymaker"], ["doubleSeamer","Double Seamer"],
  ["palletizer","Palletizer"], ["frameStraps","Frame & Straps"], ["forklift","Forklift"]
];
const MAX_PER_POS = 3;
const MAX_JOBS = 4;     // a line can run several products/customers at the same size

/* Line status — what the line is doing today. Each has its own color on the board.
   key ""  = idle. `pill` is the short board label; `label` is the dropdown text. */
const STATUS = {
  ""     : { pill:"Idle",    label:"— Idle —",             color:"var(--edge2)", fg:"var(--muted)" },
  run1   : { pill:"Run 1st", label:"Run 1st",              color:"var(--green)", fg:"#0d1117" },
  run2   : { pill:"Run 2nd", label:"Run 2nd",              color:"var(--blue)",  fg:"#0d1117" },
  backup : { pill:"Back Up", label:"Back Up",              color:"var(--purple)",fg:"#ffffff" },
  rwr    : { pill:"RWR",     label:"RWR (Run When Ready)",  color:"var(--amber)", fg:"#161009" },
  co     : { pill:"CO",      label:"CO (Change Over)",      color:"var(--red)",   fg:"#ffffff" }
};
const STATUS_ORDER = ["", "run1", "run2", "backup", "rwr", "co"];
function statusOf(l){ return STATUS[l.status] ? l.status : ""; }

const DEFAULT_LINE_ORDER = ["6","5","4","2"];
/* Rail: absent/vacation are people lists (roster dropdowns); custodian is free text.
   The Press Department is its own thing: one operator dropdown per press unit. */
const STAFF_PEOPLE = [["absent","Absent","pab"], ["vacation","Vacation","pvac"], ["custodian","Custodian","pcust"]];
const STAFF_TEXT   = [];
/* Press / Litho units — each gets its own operator dropdown (roster names, up to MAX_PER_POS). */
const PRESS_UNITS = ["13","15","16","17","18","19","20","3","2-SS","3-SS"];
/* Pallet set-up options, in the order they should always display:
   straps → cover caps → frame → pallet type. Wood pallet is the implied
   default (95% of jobs), so only the plastic exception is listed. */
const PALLET_OPTS = ["2 Straps","4 Straps","Cover Caps","Plastic Frames","Wood Frame","Plastic Pallet"];
const STRIPE_OPTS  = ["I/S","O/S"];   // inside stripe (I/S) / outside stripe (O/S)
function sortPallet(arr){
  return (arr||[]).filter(Boolean).slice().sort((a,b)=>{
    const ia=PALLET_OPTS.indexOf(a), ib=PALLET_OPTS.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
}

/* ============================ Storage layer ============================
   When API_URL is set, reads/writes go to the Cloudflare Worker (KV-backed) so
   every screen shares one board. Otherwise the board is kept in this browser's
   localStorage. The people roster is stored separately (one list, all days) so
   it can later be backed by a Google Sheet. Failures are thrown, never
   swallowed, so a save can't silently vanish. */
const Store = {
  async get(key){
    if(API_URL) return await callApi('getBoard',[key]);
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  },
  async set(key,val){
    if(API_URL){ await callApi('setBoard',[key,val]); return; }
    localStorage.setItem(key, JSON.stringify(val));
  },
  async getRoster(){
    if(API_URL) return await callApi('getRoster',[]);
    const raw = localStorage.getItem('roster');
    return raw ? JSON.parse(raw) : [];
  },
  async setRoster(list){
    if(API_URL){ await callApi('setRoster',[list]); return; }
    localStorage.setItem('roster', JSON.stringify(list));
  }
};

/* ============================ State ============================ */
let mode = "board";
let curDate = todayStr();
let board = null;
let roster = [];   // list of people's names — fills the position / absent / vacation dropdowns
let saveTimer = null, saving = false, saveError = null, loadError = null;
let daySaved = false;      // true when the day being viewed exists as a saved board (for slip lookup)
let lastBoardSig = null;   // last board we've seen from storage — used to skip needless re-renders
let lastSyncAt = null;     // when the display last confirmed it's in sync with the server
function boardSig(b){ try{ return JSON.stringify(b); }catch(e){ return 'x'+Math.random(); } }

function todayStr(d=new Date()){ return d.toLocaleDateString('en-CA'); } // YYYY-MM-DD local
function keyFor(date){ return "board:"+date; }
function fmtDateLong(date){
  const [y,m,d]=date.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function num(v){ const n=parseFloat(String(v).replace(/,/g,'')); return isFinite(n)?n:0; }
function commas(n){ return n==null||n===''?'':Number(n).toLocaleString('en-US'); }
/* Reformat a numeric input's value with thousands commas as you type (digits only). */
function commaField(el){
  const raw=(el.value||'').replace(/[^\d]/g,'');
  const out=raw?Number(raw).toLocaleString('en-US'):'';
  el.value=out;
  try{ el.setSelectionRange(out.length,out.length); }catch(e){}
  return out;
}

/* A line runs one can SIZE, but can carry several JOBS (products) at that size —
   same size, different customer — each with its own code, ends and order qty.
   status: "" idle / run1 / run2 / backup / rwr / co  (colored pill + border).
   ops[k]: ARRAY of up to 3 names per position (extras = trainees / 2nd person). */
function blankJob(){ return { code:"", cust:"", ends:"", order:"", made:"", stripe:[], pallet:[] }; }
/* Stripe on the can — inside (I/S), outside (O/S), or both. Kept as an
   array subset of STRIPE_OPTS in canonical order so the board reads I/S then O/S. */
function stripeArr(v){
  const src = Array.isArray(v) ? v.map(x=>String(x||'').trim())
            : (typeof v==='string' ? v.split(/[^A-Za-z/]+/) : []);
  return STRIPE_OPTS.filter(o=> src.includes(o));
}
/* Press Department: a list of running presses. Each row picks a press unit and
   one or more operators — [{u:"13", ops:["Andy"]}, …]. Add a row per press. */
function blankPressRow(){ return { u:"", ops:[""], end:"", mode:"", qty:"" }; }
function normalizePresses(sp){
  const out=[];
  if(Array.isArray(sp)){
    sp.forEach(e=>{
      const u=String(e&&e.u!=null?e.u:'');
      const ops=(Array.isArray(e&&e.ops)?e.ops:[]).map(x=>String(x==null?'':x)).slice(0,MAX_PER_POS);
      const end=String(e&&e.end!=null?e.end:''), mode=String(e&&e.mode!=null?e.mode:''), qty=String(e&&e.qty!=null?e.qty:'');
      if(u || ops.some(x=>x.trim())) out.push({u, ops:ops.length?ops:[""], end, mode, qty});
    });
  }else if(sp && typeof sp==='object'){          // migrate old object model {u:[names]}
    PRESS_UNITS.forEach(u=>{
      const ops=(Array.isArray(sp[u])?sp[u]:[]).map(x=>String(x==null?'':x)).filter(Boolean);
      if(ops.length) out.push({u, ops, end:"", mode:"", qty:""});
    });
  }
  return out;
}
const PRESS_MODES = ["","Open","Shipping","Both"];
function blankLine(lineNo){
  return { lineNo:String(lineNo), status:"", size:"", desc:"", po:"", hidden:false,
    ops:{bodymaker:[""],doubleSeamer:[""],palletizer:[""],frameStraps:[""],forklift:[""]},
    jobs:[ blankJob() ] };
}
function blankBoard(date){
  return { date, announce:"", lines: DEFAULT_LINE_ORDER.map(blankLine),
    staff:{absent:[],vacation:[],presses:[],custodian:[]} };
}
/* Names for a position, always as an array of strings (max MAX_PER_POS). */
function opArr(l,k){
  let v = l.ops ? l.ops[k] : undefined;
  if(!Array.isArray(v)) v = (v==null || v==='') ? [] : [v];
  return v.map(s=>String(s==null?'':s)).slice(0,MAX_PER_POS);
}
function toNameArr(v){
  if(Array.isArray(v)) return v.map(x=>String(x==null?'':x));
  if(typeof v==='string' && v.trim()) return v.split('\n').map(s=>s.trim()).filter(Boolean);
  return [];
}
/* Older saved boards may miss newer fields — fill them in so render is safe. */
function normalizeLine(l){
  const b=blankLine(l.lineNo||"");
  l.ops = l.ops || {};
  OP_ROLES.forEach(([k])=>{ const a=opArr(l,k); l.ops[k]=a.length?a:[""]; });
  const palOf=(v)=> (Array.isArray(v) ? v.map(x=>String(x==null?'':x)).filter(Boolean)
                   : (typeof v==='string' && v.trim() ? [v.trim()] : []))
                   .filter(x=>x!=='Wood Pallet');   // wood is the implied default
  // jobs: use the array if present, else build one from legacy flat fields
  if(Array.isArray(l.jobs) && l.jobs.length){
    l.jobs = l.jobs.map(j=>({ code:String(j.code||''), cust:String(j.cust||''),
      ends:String(j.ends||''), order:String(j.order==null?'':j.order), made:String(j.made==null?'':j.made),
      stripe:stripeArr(j.stripe!=null?j.stripe:j.spray), pallet:palOf(j.pallet) })).slice(0,MAX_JOBS);
  }else{
    const j1={ code:String(l.code||''), cust:String(l.cust||l.of||''), ends:String(l.ends1||''),
      order:String(l.order==null?'':l.order), made:String(l.made==null?'':l.made), pallet:[] };
    l.jobs=[j1];
    if(l.ends2) l.jobs.push({ code:'', cust:'', ends:String(l.ends2), order:'', made:'', pallet:[] });
  }
  // legacy: pallet used to live on the line — move it onto the first product
  const linePallet = palOf(l.pallet);
  if(linePallet.length && l.jobs[0] && !l.jobs[0].pallet.length) l.jobs[0].pallet = linePallet;
  delete l.pallet;
  for(const k in b) if(k!=='ops' && k!=='jobs' && l[k]===undefined) l[k]=b[k];
  l.po = String(l.po==null?'':l.po);
  l.hidden = !!l.hidden;
  if(l.status===undefined || l.status===null){     // migrate legacy changeover flag
    l.status = l.changeover ? 'co' : (l.size ? 'run1' : '');
  }
  return l;
}
function normalizeBoard(bd){
  if(!bd.lines) bd.lines=[];
  bd.announce = typeof bd.announce==='string' ? bd.announce : '';
  bd.lines.forEach(normalizeLine);
  const s = bd.staff||{};
  bd.staff = {
    absent: toNameArr(s.absent),
    vacation: toNameArr(s.vacation),
    presses: normalizePresses(s.presses),
    custodian: toNameArr(s.custodian)
  };
  return bd;
}

async function loadRoster(){
  try{ const r = await Store.getRoster(); roster = Array.isArray(r)?r:[]; }
  catch(e){ roster = []; }
}
/* Carry a saved day forward as the starting point for the next work-day.
   Status is kept exactly as it was (a CO stays a CO). Each job's remaining
   order = previous remaining − what was made yesterday; that made amount is
   remembered as "made yesterday" and the running "made" field resets, so a
   big order counts down day by day and repeats. */
function seedFromBoard(src){
  const bd = normalizeBoard(JSON.parse(JSON.stringify(src)));
  bd.announce = "";   // announcements are day-specific — don't carry yesterday's forward
  bd.lines.forEach(l=>{
    (l.jobs||[]).forEach(j=>{
      const o=num(j.order), m=num(j.made);
      if(o) j.order = String(Math.max(o-m,0));   // remaining carries over
      j.made = "";                                // fresh day — enter yesterday's run again
    });
  });
  return bd;
}
/* Most recent saved board within a few work-days back (skips weekends/gaps). */
async function findSeedBoard(date){
  let d=date;
  for(let i=0;i<6;i++){
    d=shiftWorkday(d,-1);
    try{ const b=await Store.get(keyFor(d)); if(b) return b; }
    catch(e){ return null; }
  }
  return null;
}
async function loadBoard(date){
  loadError = null;
  daySaved = false;
  try{
    const existing = await Store.get(keyFor(date));
    if(existing){
      board = normalizeBoard(existing);
      daySaved = true;
    }else{
      // No board saved yet for this day — carry the previous work-day forward
      // (production rarely changes much). Not saved until someone edits it.
      const seed = await findSeedBoard(date);
      board = seed ? seedFromBoard(seed) : blankBoard(date);
    }
  }catch(e){
    // Couldn't reach the board store. Show an empty day but WARN, because any
    // edit from here would overwrite whatever the server actually holds.
    loadError = e && e.message ? e.message : 'Could not load this day';
    board = blankBoard(date);
  }
  board.date = date;
  lastBoardSig = boardSig(board);   // baseline: the display won't re-render until this changes
  lastSyncAt = Date.now();
}
function scheduleSave(){
  refreshConflicts();      // keep the conflict banner live as fields change
  if(loadError){ return; } // don't overwrite the server with a board we failed to load
  saving=true; saveError=null; updateSaveChip();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ await Store.set(keyFor(board.date), board); saveError=null; lastBoardSig=boardSig(board); lastSyncAt=Date.now(); }
    catch(e){ saveError = e && e.message ? e.message : 'Save failed'; }
    saving=false; updateSaveChip();
  }, 500);
}
function updateSaveChip(){
  const c=document.getElementById('saveChip'); if(!c) return;
  c.classList.toggle('saving', saving && !saveError);
  c.classList.toggle('error', !!saveError && !saving);
  c.querySelector('.txt').textContent = saveError ? ('Not saved — '+saveError) : (saving ? 'Saving…' : 'Saved');
  c.title = saveError || '';
}

/* ---- Roster (people) ---- */
function rosterAdd(name){
  name=(name||'').trim(); if(!name) return false;
  if(roster.some(x=>x.toLowerCase()===name.toLowerCase())) return true;  // already there
  roster.push(name); saveRoster(); return true;
}
function rosterRemove(i){ if(i>=0 && i<roster.length){ roster.splice(i,1); saveRoster(); } }
async function saveRoster(){
  try{ await Store.setRoster(roster); }
  catch(e){ alert('Could not save the roster: '+(e && e.message ? e.message : e)); }
}

/* ============================ Helpers ============================ */
/* Find people scheduled in conflicting spots — working while marked
   absent/vacation, double-booked across positions, or absent AND on vacation.
   Hidden lines are ignored (they're not on the board). */
/* Statuses that run at different times of day, so ONE person can cover two of
   them (run first, then move to the next). A double-booking that's only across
   these — and across DIFFERENT ones — is a soft "caution", not a hard conflict. */
const SEQ_STATUS = new Set(['run1','run2','rwr']);
function collectConflicts(){
  const people={};
  function add(raw, label, kind, status){
    const k=String(raw||'').trim().toLowerCase(); if(!k) return;
    const p=people[k]||(people[k]={name:String(raw).trim(), locs:[]});
    if(!p.locs.some(x=>x.label===label && x.kind===kind))
      p.locs.push({label, kind, st:status||'', seq:SEQ_STATUS.has(status)});
  }
  board.lines.forEach(l=>{
    if(l.hidden) return;
    const st=statusOf(l);
    if(st==='') return;   // idle line: ready, not running — its names don't count as booked
    OP_ROLES.forEach(([key,label])=> opArr(l,key).forEach(n=> add(n,'Line '+(l.lineNo||'?')+' · '+label,'work',st)));
  });
  (board.staff.presses||[]).forEach(row=>
    (row.ops||[]).forEach(n=> add(n,'Press '+(row.u||'?'),'work')));
  (board.staff.custodian||[]).forEach(n=> add(n,'Custodian','work'));
  (board.staff.absent||[]).forEach(n=> add(n,'Absent','absent'));
  (board.staff.vacation||[]).forEach(n=> add(n,'Vacation','vacation'));

  const out=[];
  Object.keys(people).forEach(k=>{
    const p=people[k];
    const work=p.locs.filter(x=>x.kind==='work');
    const absent=p.locs.some(x=>x.kind==='absent');
    const vac=p.locs.some(x=>x.kind==='vacation');
    // Off conflicts (working while marked off, or both off states) — always a
    // hard alert, shown on the board too. This is the vacation/absent exception.
    if(work.length && (absent||vac)){
      const off=[absent?'Absent':null, vac?'Vacation':null].filter(Boolean).join(' & ');
      out.push({name:p.name, sev:'alert', msg:'is marked '+off+' but is also assigned to '+work.map(w=>w.label).join(', ')});
    }
    if(absent && vac){
      out.push({name:p.name, sev:'alert', msg:'is listed as both Absent and on Vacation'});
    }
    // Double-booked while working. Soften to a caution (edit-only, no board
    // banner) when every spot is a Run 1st / Run 2nd / RWR line AND they're
    // different slots — those run at different times, so one person can cover
    // them. Same-slot (e.g. two Run 1st) or any press/custodian stays an alert.
    if(work.length>=2){
      const allSeq = work.every(w=>w.seq);
      const distinct = new Set(work.map(w=>w.st)).size === work.length;
      const sev = (allSeq && distinct) ? 'caution' : 'alert';
      const verb = sev==='caution' ? 'is covering ' : 'is booked in ';
      const tail = sev==='caution'
        ? work.length+' running lines — '+work.map(w=>w.label).join(', ')+' (they run at different times)'
        : work.length+' spots at once — '+work.map(w=>w.label).join(', ');
      out.push({name:p.name, sev, msg:verb+tail});
    }
  });
  return out;
}
/* Announcement banner — only rendered when there's actually a message. Shown
   big and bright on both the board and the edit view so nobody misses it. */
function announceBannerHTML(){
  const msg = String((board && board.announce) || '').trim();
  if(!msg) return '';
  return `<div class="announce" role="alert">
    <span class="announce-ico">📢</span>
    <div class="announce-body"><span class="announce-h">Announcement</span><div class="announce-msg">${esc(msg)}</div></div>
  </div>`;
}
/* includeCaution: the edit view shows both the red alerts and the amber
   cautions; the board view passes false so only real alerts ever reach it. */
function conflictBannerHTML(includeCaution){
  const all = collectConflicts();
  const alerts   = all.filter(c=>c.sev!=='caution');
  const cautions = includeCaution ? all.filter(c=>c.sev==='caution') : [];
  let html='';
  if(alerts.length){
    html += `<div class="conflicts">
      <div class="conflicts-h">⚠ ${alerts.length} scheduling conflict${alerts.length>1?'s':''}</div>
      <ul>${alerts.map(c=>`<li><b>${esc(c.name)}</b> ${esc(c.msg)}</li>`).join('')}</ul>
    </div>`;
  }
  if(cautions.length){
    html += `<div class="cautions">
      <div class="cautions-h">◆ ${cautions.length} heads-up${cautions.length>1?'s':''}</div>
      <ul>${cautions.map(c=>`<li><b>${esc(c.name)}</b> ${esc(c.msg)}</li>`).join('')}</ul>
    </div>`;
  }
  return html;
}
/* Names currently flagged, split by severity — used to color the edit fields.
   Red (alert) wins over amber (caution) if a person is in both. */
let CFLICT_SET = new Set();
let CAUTION_SET = new Set();
function conflictNames(){
  const alert=new Set(), caution=new Set();
  collectConflicts().forEach(c=>{
    const k=String(c.name).trim().toLowerCase();
    if(c.sev==='caution') caution.add(k); else alert.add(k);
  });
  alert.forEach(k=> caution.delete(k));
  return {alert, caution};
}
function conflictClass(n){
  const k = n && String(n).trim().toLowerCase();
  if(!k) return '';
  if(CFLICT_SET.has(k))  return ' conflict';
  if(CAUTION_SET.has(k)) return ' caution';
  return '';
}
/* Update the banner AND the field highlights in place (no full re-render). */
function refreshConflicts(){
  const sets = conflictNames();
  CFLICT_SET = sets.alert; CAUTION_SET = sets.caution;
  const box=document.getElementById('conflictBox');
  if(box) box.innerHTML=conflictBannerHTML(mode==='edit');
  if(mode==='edit'){
    document.querySelectorAll('#view select[data-op],#view select[data-staffp],#view select[data-pressrow]').forEach(sel=>{
      const v=(sel.value||'').trim().toLowerCase();
      sel.classList.toggle('conflict', !!v && CFLICT_SET.has(v));
      sel.classList.toggle('caution', !!v && !CFLICT_SET.has(v) && CAUTION_SET.has(v));
    });
  }
}

/* ============================ Render: BOARD (TV) ============================ */
function orderInline(j){
  const o=num(j.order);
  if(!o) return '';                       // no order qty → show nothing (no "standing order")
  const m=num(j.made);
  if(m>=o) return `<span><span class="lbl">Order</span> <b>${commas(o)}</b> · <span class="done">✓ complete</span></span>`;
  if(!m) return `<span><span class="lbl">Left</span> <b>${commas(o)}</b> <span class="ord-sub">to run</span></span>`;
  const left=Math.max(o-m,0);
  // the big number is what's LEFT; the order total + made yesterday are the small print
  return `<span><span class="lbl">Left</span> <b>${commas(left)}</b> <span class="ord-sub">(${commas(o)} order · ${commas(m)} made yesterday)</span></span>`;
}
function cardHTML(l){

  const ops = st==='' ? '' : OP_ROLES.map(([k,label])=>{
    const names = opArr(l,k).map(s=>s.trim()).filter(Boolean);

      ? `<span class="who"><span class="n1">${esc(names[0])}</span>${names.slice(1).map(n=>`<span class="nx">+ ${esc(n)}</span>`).join('')}</span>`
      : `<span class="who empty">—</span>`;

          <span class="lc-size">${esc(l.size)||'<span style="color:var(--dim)">—</span>'}</span>
        </div>
        ${l.desc?`<div class="lc-desc">${esc(l.desc)}</div>`:''}
      </div>
      ${l.po?`<span class="lc-po"><span class="lbl">PO</span> ${esc(l.po)}</span>`:''}
    </div>
    ${jobsHTML?`<div class="jobs">${jobsHTML}</div>`:''}

/* Board order: running lines first (Run 1st, Run 2nd, Back Up, RWR, CO), idle last. */
const BOARD_PRIO = {run1:0, run2:1, backup:2, rwr:3, co:4, "":5};
function renderBoard(){
  // Hidden lines never show. Sort the rest by status priority.
  const cards = board.lines.filter(l=>!l.hidden)
    .slice().sort((a,b)=> (BOARD_PRIO[statusOf(a)] ?? 9) - (BOARD_PRIO[statusOf(b)] ?? 9));
  const n = cards.length;
  // Tiles resize to fill: 1 wide, 2 side-by-side, 3 across, 4 as 2×2, then 3-up.
  const cols = n<=1?1 : n===2?2 : n===3?3 : n===4?2 : n<=6?3 : 4;
  const cardsHTML = n ? cards.map(cardHTML).join('')
    : `<div class="board-empty">No lines scheduled for today</div>`;
  const boardMain = `<div class="board-grid" data-n="${n}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${cardsHTML}</div>`;

  const staffPanel = (k,label,accent)=>{
    const items=(board.staff[k]||[]).map(s=>String(s||'').trim()).filter(Boolean);
    return `<div class="panel ${accent}"><h3>${label}</h3>
      ${items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:`<div class="none">— none —</div>`}
    </div>`;
  };
  const railText = STAFF_TEXT.map(([k,label])=>{
    const items=(board.staff[k]||'').split('\n').map(s=>s.trim()).filter(Boolean);
    return `<div class="panel"><h3>${label}</h3>
      ${items.length?`<ul>${items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:`<div class="none">— none —</div>`}
    </div>`;
  }).join('');
  const pressRows = (board.staff.presses||[]).map(row=>{
    const names = (row.ops||[]).map(s=>String(s||'').trim()).filter(Boolean);
    if(!row.u || !names.length) return '';
    const bits=[];
    if(row.end)  bits.push('End '+esc(row.end));
    if(row.mode) bits.push(esc(row.mode));
    if(row.qty)  bits.push(esc(row.qty));
    const detail = bits.length ? `<span class="press-detail">${bits.join(' · ')}</span>` : '';
    return `<li><div class="press-top"><span class="press-no">Press ${esc(row.u)}</span>
      <span class="press-op">${names.map(esc).join(', ')}</span></div>${detail}</li>`;
  }).filter(Boolean).join('');
  const railPresses = `<div class="panel ppress"><h3>Press Department</h3>
    ${pressRows?`<ul class="press-list">${pressRows}</ul>`:`<div class="none">— none —</div>`}
  </div>`;

  const legend = STATUS_ORDER.filter(k=>k).map(k=>
    `<span class="li"><span class="sw" style="background:${STATUS[k].color}"></span>${STATUS[k].pill}</span>`).join('');

  document.getElementById('view').innerHTML = `
    ${announceBannerHTML()}
    <div id="conflictBox">${conflictBannerHTML(false)}</div>
    <div class="layout">
      <div class="board-main">${boardMain}</div>
      <div class="rail">${railPresses}${staffPanel('vacation','Vacation','pvac')}${staffPanel('absent','Absent','pab')}${staffPanel('custodian','Custodian','pcust')}${railText}</div>
    </div>
    <div class="legend">${legend}</div>
    <div class="safety">Have a Safe &amp; Productive Day!</div>`;
}

            <button class="btn tiny" id="pullTimeOff" title="Fill Absent &amp; Vacation from the shared Google Calendar for this day">⤓ Pull from Calendar</button>
            <span class="hint" id="timeOffStatus"></span>
          </div>
          <div class="edit-staff">${staffPeople}${staffText}</div>
        </div>
      </div>
      <div class="edit-lines">${lineCards}
        <button class="addline" id="addLine">+ Add line</button>
      </div>
      <div class="ecard" style="border-top-color:var(--edge)">
        <div class="subhead">People / Roster <span class="hint">(these names fill every dropdown — one shared list for all days)</span></div>
        <div class="roster">${rosterChips}</div>
        <div class="roster-add">
          <input id="newName" placeholder="Add a person's name…">
          <button class="btn" id="addName">Add</button>
        </div>
      </div>
    </div>`;
  updateSaveChip();
  refreshConflicts();     // apply the red field highlights
}

function sizeOptionsFor(lineNo, current){
  const allowed = LINE_SIZES[String(lineNo)] || ALL_SIZES;
  let opts = `<option value="">— none / idle —</option>`;
  allowed.forEach(s=>{ opts+=`<option value="${s}" ${s===current?'selected':''}>${s}</option>`; });
  // keep a current value that's outside the allowed list (e.g. line number edited)
  if(current && !allowed.includes(current)){
    opts+=`<option value="${current}" selected>${current}</option>`;
  }
  return opts;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ============================ Edit event wiring ============================ */
document.getElementById('view').addEventListener('input', e=>{
  const t=e.target; if(mode!=='edit') return;
  const li = t.getAttribute('data-line');
  if(li!==null){
    const idx=+li, l=board.lines[idx];
    if(t.dataset.op!==undefined && t.dataset.i!==undefined){   // a position dropdown
      const k=t.dataset.op, i=+t.dataset.i;
      if(!Array.isArray(l.ops[k])) l.ops[k]=[];
      if(t.value==='__add__'){                                 // "＋ Add new name…"
        const name=(prompt('Add a new name to the roster:')||'').trim();
        if(name){ rosterAdd(name); l.ops[k][i]=name; } else { l.ops[k][i]=l.ops[k][i]||''; }
        scheduleSave(); render(); return;
      }
      l.ops[k][i]=t.value; scheduleSave(); return;
    }
    if(t.dataset.job!==undefined && t.dataset.jf){             // a product/job field
      const ji=+t.dataset.job;
      if(!l.jobs[ji]) l.jobs[ji]=blankJob();
      const jf=t.dataset.jf;
      l.jobs[ji][jf] = (jf==='order'||jf==='made') ? commaField(t) : t.value;
      scheduleSave(); return;
    }
    if(t.dataset.f){
      const f=t.dataset.f; l[f]=t.value;
      if(f==='status'){ scheduleSave(); render(); return; }        // recolor card + header
      if(f==='size'){
        if(t.value && !l.status) l.status='run1';                  // picked a size → assume running
        else if(!t.value) l.status='';                             // cleared size → idle
        scheduleSave(); render(); return;
      }
      if(f==='lineNo'){
        const sel=document.querySelector(`.edit-lines select[data-line="${idx}"][data-f="size"]`);
        if(sel) sel.innerHTML=sizeOptionsFor(l.lineNo,l.size);
      }
      scheduleSave();
      return;
    }
  }
  if(t.dataset.staffp!==undefined && t.dataset.i!==undefined){   // absent / vacation person
    const key=t.dataset.staffp, i=+t.dataset.i;
    if(!Array.isArray(board.staff[key])) board.staff[key]=[];
    if(t.value==='__add__'){
      const name=(prompt('Add a new name to the roster:')||'').trim();
      if(name){ rosterAdd(name); board.staff[key][i]=name; }
      scheduleSave(); render(); return;
    }
    board.staff[key][i]=t.value; scheduleSave(); return;
  }
  if(t.dataset.pressunit!==undefined){                          // which press this row is
    const row=board.staff.presses[+t.dataset.pressunit];
    if(row){ row.u=t.value; scheduleSave(); }
    return;
  }
  if(t.dataset.prow!==undefined && t.dataset.pf){               // press end / mode / qty
    const row=board.staff.presses[+t.dataset.prow];
    if(row){ row[t.dataset.pf] = (t.dataset.pf==='qty') ? commaField(t) : t.value; scheduleSave(); }
    return;
  }
  if(t.dataset.pressrow!==undefined && t.dataset.i!==undefined){ // press operator name
    const row=board.staff.presses[+t.dataset.pressrow], i=+t.dataset.i;
    if(!row) return;
    if(!Array.isArray(row.ops)) row.ops=[""];
    if(t.value==='__add__'){
      const name=(prompt('Add a new name to the roster:')||'').trim();
      if(name){ rosterAdd(name); row.ops[i]=name; }
      scheduleSave(); render(); return;
    }
    row.ops[i]=t.value; scheduleSave(); return;
  }
  if(t.dataset.announce!==undefined){
    board.announce=t.value; scheduleSave();
    const pv=document.getElementById('announcePreview');   // live preview, keep focus in the box
    if(pv) pv.innerHTML=announceBannerHTML();
    return;
  }
  if(t.dataset.staff!==undefined){ board.staff[t.dataset.staff]=t.value; scheduleSave(); return; }
});
document.getElementById('view').addEventListener('keydown', e=>{
  if(mode==='edit' && e.target && e.target.id==='newName' && e.key==='Enter'){
    e.preventDefault();
    if(rosterAdd(e.target.value)) render();
  }
});
/* Normalize a calendar name to the roster's spelling when it matches (case-insensitive),
   so calendar entries line up with the dropdowns. */
function matchRoster(names){
  return (names||[]).map(n=>{ const hit=roster.find(r=>r.toLowerCase()===String(n).toLowerCase()); return hit||n; });
}
/* Pull today's Absent / Vacation people from the shared Google Calendar (via the Worker)
   and merge them into this day's lists — existing manual entries are kept. */
async function pullTimeOff(){
  const st=document.getElementById('timeOffStatus');
  const setStatus=(msg,err)=>{ const el=document.getElementById('timeOffStatus'); if(el){ el.style.color=err?'var(--red)':''; el.textContent=msg; } };
  if(!API_URL){ setStatus('Calendar needs the online backend (API_URL is blank).',true); return; }
  setStatus('Checking calendar…',false);
  try{
    const res=await callApi('getTimeOff',[keyFor(curDate)]);
    const norm=arr=>Array.from(new Set((arr||[]).map(s=>String(s||'').trim()).filter(Boolean)));
    const calVac=matchRoster(norm(res&&res.vacation));
    const calAbs=matchRoster(norm(res&&res.absent));
    const merge=(cur,add)=>{ const out=(Array.isArray(cur)?cur.slice():[]).map(s=>String(s||'').trim()).filter(Boolean);
      add.forEach(n=>{ if(!out.some(x=>x.toLowerCase()===String(n).toLowerCase())) out.push(n); }); return out; };
    board.staff.vacation=merge(board.staff.vacation,calVac);
    board.staff.absent=merge(board.staff.absent,calAbs);
    scheduleSave(); render();
    setStatus((calVac.length+calAbs.length)
      ? ('Pulled '+calVac.length+' on vacation, '+calAbs.length+' absent for this day.')
      : 'No time-off entries on the calendar for this day.', false);
  }catch(e){ setStatus('Calendar error: '+(e&&e.message?e.message:'failed'), true); }
}
document.getElementById('view').addEventListener('click', async e=>{
  const t=e.target;
  if(t.id==='pullTimeOff'){ pullTimeOff(); return; }
  if(t.id==='addLine'){ board.lines.push(blankLine("")); scheduleSave(); render(); }
  else if(t.id==='addPressRow'){ board.staff.presses.push(blankPressRow()); scheduleSave(); render(); }
  else if(t.id==='addName'){ const inp=document.getElementById('newName'); if(rosterAdd(inp&&inp.value)) render(); }
  else if(t.dataset.ri!==undefined){ rosterRemove(+t.dataset.ri); render(); }
  else if(t.dataset.addop!==undefined){                          // add a person to a position
    const idx=+t.dataset.line, k=t.dataset.addop, arr=board.lines[idx].ops[k];
    if(Array.isArray(arr) && arr.length<MAX_PER_POS){ arr.push(""); scheduleSave(); render(); }
  }
  else if(t.dataset.addstaff!==undefined){                       // add a person to absent/vacation
    const key=t.dataset.addstaff;
    if(!Array.isArray(board.staff[key])) board.staff[key]=[];
    board.staff[key].push(""); scheduleSave(); render();
  }
  else if(t.dataset.addpressperson!==undefined){                 // add a trainee to a press row
    const row=board.staff.presses[+t.dataset.addpressperson];
    if(row){ if(!Array.isArray(row.ops)) row.ops=[""];
      if(row.ops.length<MAX_PER_POS){ row.ops.push(""); scheduleSave(); render(); } }
  }
  else if(t.dataset.rmpressrow!==undefined){                     // remove a press row
    board.staff.presses.splice(+t.dataset.rmpressrow,1);
    scheduleSave(); render();
  }
  else if(t.dataset.pallet!==undefined){                         // toggle a product's pallet set-up option
    const L=board.lines[+t.dataset.line], j=L&&L.jobs[+t.dataset.job], opt=t.dataset.pallet;
    if(j){
      if(!Array.isArray(j.pallet)) j.pallet=[];
      const i=j.pallet.indexOf(opt);
      if(i>=0) j.pallet.splice(i,1); else j.pallet.push(opt);
      scheduleSave(); render();
    }
  }
  else if(t.dataset.stripe!==undefined){                          // toggle a product's stripe (I/S / O/S)
    const L=board.lines[+t.dataset.line], j=L&&L.jobs[+t.dataset.job], opt=t.dataset.stripe;
    if(j){
      const set=new Set(stripeArr(j.stripe));
      if(set.has(opt)) set.delete(opt); else set.add(opt);
      j.stripe=STRIPE_OPTS.filter(o=>set.has(o));   // keep canonical I/S-then-O/S order
      scheduleSave(); render();
    }
  }
  else if(t.dataset.hideline!==undefined){                       // hide/show a line on the board
    const L=board.lines[+t.dataset.hideline];
    L.hidden=!L.hidden; scheduleSave(); render();
  }
  else if(t.dataset.addjob!==undefined){                         // add a product/job to a line
    const i=+t.dataset.addjob, L=board.lines[i];
    if(L.jobs.length<MAX_JOBS){ L.jobs.push(blankJob()); scheduleSave(); render(); }
  }
  else if(t.dataset.rmjob!==undefined){                          // remove a product/job
    const i=+t.dataset.rmjob, ji=+t.dataset.ji;
    board.lines[i].jobs.splice(ji,1);
    if(!board.lines[i].jobs.length) board.lines[i].jobs=[blankJob()];
    scheduleSave(); render();
  }
  else if(t.dataset.rmline!==undefined){ board.lines.splice(+t.dataset.rmline,1); scheduleSave(); render(); }
  else if(t.id==='clearDay'){ if(confirm('Clear all entries for this day?')){ board=blankBoard(curDate); scheduleSave(); render(); } }
  else if(t.id==='copyPrev'){ await copyFromYesterday(); }
});
async function copyFromYesterday(){
  const prev=shiftWorkday(curDate,-1);   // previous work-day (skips the weekend)
  let src;
  try{ src=await Store.get(keyFor(prev)); }
  catch(err){ alert('Could not reach the board server to load '+fmtDateLong(prev)); return; }
  if(!src){ alert('No board found for '+fmtDateLong(prev)); return; }
  // Copy the setup as a starting point: roll CO→Run 1st and carry order remainders.
  board = seedFromBoard(src);
  board.date=curDate;
  scheduleSave(); render();
}

/* ============================ Nav / mode / fullscreen ============================ */
async function goDate(date){ curDate=date; await loadBoard(date); render(); }
/* Step one work-day in a direction, skipping Sat/Sun. */
function shiftWorkday(dateStr, dir){
  const [y,m,d]=dateStr.split('-').map(Number);
  let dt=new Date(y,m-1,d);
  do{ dt=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()+dir); }
  while(dt.getDay()===0 || dt.getDay()===6);
  return todayStr(dt);
}
document.getElementById('prevDay').onclick=()=>{ goDate(shiftWorkday(curDate,-1)); };
document.getElementById('nextDay').onclick=()=>{ goDate(shiftWorkday(curDate,+1)); };
document.getElementById('todayBtn').onclick=()=>goDate(todayStr());
document.getElementById('datePick').onchange=e=>goDate(e.target.value);
document.getElementById('mBoard').onclick=()=>{ mode='board'; render(); };
document.getElementById('mEdit').onclick=()=>{ mode='edit'; render(); };
/* TV / kiosk mode: opening the page with ?tv (e.g. the display PC's kiosk shortcut)
   forces the clean board look — hides the toolbar buttons and the Board/Edit switch —
   even though browser kiosk fullscreen doesn't trigger the Fullscreen API. The plain
   URL (your editing PC) keeps all the controls. */
const TV_MODE = /(?:[?&]tv\b|[?&]kiosk\b|#tv\b|#kiosk\b)/i.test(location.search + location.hash);
document.getElementById('fsBtn').onclick=()=>{
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); mode='board'; render(); }
  else document.exitFullscreen&&document.exitFullscreen();
};
document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('fs', TV_MODE || !!document.fullscreenElement));
function doPrint(light){
  // Print a snapshot of the schedule (the board), not the edit screen.
  if(mode!=='board'){ mode='board'; render(); }
  document.body.classList.toggle('print-light', !!light);
  setTimeout(()=>window.print(), 60);
}
document.getElementById('printBtn').onclick=()=>doPrint(false);
document.getElementById('printBtnLight').onclick=()=>doPrint(true);
window.addEventListener('afterprint',()=>document.body.classList.remove('print-light'));

/* live clock */
function tick(){ document.getElementById('clock').textContent =
  new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false}); }
setInterval(tick,1000); tick();

/* Live sync — usage-friendly schedule (Cloudflare-backed board).
   To keep Cloudflare/Google-Sheet calls low, a display only checks for edits on a
   time-of-day schedule (local shop time):
     • 5:00–7:00 AM  → every 20 s   (morning setup, things change fast)
     • 7:00 AM–2:30 PM → every 5 min (light background refresh through the shift)
     • 2:30 PM–5:00 AM → no automatic checks at all
   Anyone can force an instant update anytime with the ⟳ Refresh button (1 call).
   Even during an active window it only actually calls out when the tab is visible
   and this screen isn't editing, and it re-paints ONLY when the board changed. */
const SYNC_WINDOWS = [
  { startMin: 5*60,        endMin: 7*60,          every: 20*1000  },   // 5–7 AM: 20 s
  { startMin: 7*60,        endMin: 14*60+30,      every: 5*60*1000 }   // 7 AM–2:30 PM: 5 min
];
function currentWindow(){
  const d=new Date();
  const day=d.getDay();                 // 0 Sun … 6 Sat
  if(day===0 || day===6) return null;   // weekends: no automatic checks (⟳ Refresh still works)
  const mins=d.getHours()*60+d.getMinutes();
  return SYNC_WINDOWS.find(w=> mins>=w.startMin && mins<w.endMin) || null;
}
let polling=false;
/* Fetch the board and re-paint if it changed. `manual` bypasses the schedule (the
   Refresh button) but still respects edit-mode / already-in-flight guards. */
async function pollBoard(manual){
  if(polling) return;
  if(!manual && (mode!=='board' || saving || document.hidden)) return;
  if(mode!=='board' || saving) return;
  polling=true;
  try{
    const fresh=await Store.get(keyFor(curDate));
    if(fresh){
      const sig=boardSig(fresh);
      if(sig!==lastBoardSig){                 // something changed elsewhere — pull it in
        lastBoardSig=sig;
        board=normalizeBoard(fresh); board.date=curDate;
        renderBoard(); updateCoChip();
      }
      lastSyncAt=Date.now();
    }
  }catch(e){ /* transient network blip — keep showing the last good board */ }
  finally{ polling=false; markSynced(); }
}
/* Self-scheduling tick: sleeps until the next check the current window calls for,
   and simply re-evaluates every 5 min during off-hours (no fetch) so it wakes up
   on its own when the next morning window opens. */
let syncTimer=null;
function scheduleSync(){
  clearTimeout(syncTimer);
  const w=currentWindow();
  if(w) pollBoard(false);
  syncTimer=setTimeout(scheduleSync, w ? w.every : 5*60*1000);
}
/* Manual refresh: always allowed, exactly one call, ignores the schedule. */
function manualRefresh(){ pollBoard(true); }
const rb=document.getElementById('refreshBtn'); if(rb) rb.onclick=manualRefresh;

/* Production slip button: shown whenever the online backend is configured (hidden
   on the TV/fullscreen via hide-fs). Clicking opens that day's scanned PDF, which
   the Worker streams with the service account; a day with no scan shows a friendly
   "no slip found" page instead. */
function updateSlipBtn(){
  const btn=document.getElementById('slipBtn'); if(!btn) return;
  btn.style.display = API_URL ? '' : 'none';
}
const sb=document.getElementById('slipBtn');
if(sb) sb.onclick=()=>{ if(API_URL) window.open(API_URL+'?slip='+encodeURIComponent(curDate),'_blank','noopener'); };

/* Status note in the header so the floor can see the sync state at a glance. */
function markSynced(){
  const el=document.getElementById('liveNote'); if(!el) return;
  if(mode!=='board' || loadError){ el.textContent=''; el.classList.remove('stale'); return; }
  const w=currentWindow();
  const secs=lastSyncAt?Math.max(0,Math.round((Date.now()-lastSyncAt)/1000)):null;
  const ago = secs===null ? 'not yet' : (secs<60?(secs<2?'just now':secs+'s ago')
            : Math.round(secs/60)+'m ago');
  if(w){ el.textContent='● Live · '+ago; el.classList.toggle('stale', secs!==null && secs>w.every/1000+30); }
  else { el.textContent='⏸ Auto-sync off · ⟳ to refresh · updated '+ago; el.classList.add('stale'); }
}
setInterval(markSynced, 1000);
scheduleSync();

/* ============================ Boot ============================ */
(async function init(){
  if(TV_MODE){ mode='board'; document.body.classList.add('fs'); }   // clean board look for the display PC
  await loadRoster(); await loadBoard(curDate); render();
})();
</script>
